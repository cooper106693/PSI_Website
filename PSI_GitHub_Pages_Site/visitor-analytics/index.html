<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Visitor Analytics | PSI Program</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    :root{--analytics-blue:#063c7d;--analytics-blue-2:#084fa8;--analytics-ink:#153047;--analytics-muted:#64798a;--analytics-line:#cddce8;--analytics-pale:#f3f7fb;--analytics-yellow:#ffd426}
    .analytics-page{min-height:100vh;background:#fff;color:var(--analytics-ink)}
    .analytics-page .header{background:#fff;border-bottom:1px solid var(--analytics-line)}
    .analytics-page .header nav{align-items:center}
    .more-menu{position:relative;font-size:13px;font-weight:700}
    .more-menu summary{cursor:pointer;list-style:none;padding:8px 0;color:var(--analytics-ink)}
    .more-menu summary::-webkit-details-marker{display:none}
    .more-menu summary:after{content:"⌄";margin-left:6px;color:var(--analytics-blue-2)}
    .more-menu[open] summary:after{content:"⌃"}
    .more-menu .more-panel{position:absolute;right:0;top:39px;z-index:20;display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:2px;min-width:350px;padding:10px;background:#fff;border:1px solid var(--analytics-line);border-radius:14px;box-shadow:0 18px 45px rgba(21,48,71,.15)}
    .more-menu a{display:block;padding:9px 11px;color:var(--analytics-ink);text-decoration:none;border-radius:8px;font-size:12px}
    .more-menu a:hover{background:var(--analytics-pale);color:var(--analytics-blue-2)}
    .analytics-hero{position:relative;overflow:hidden;background:var(--analytics-blue);color:#fff;padding:88px 0 86px}
    .analytics-hero:after{content:"";position:absolute;right:-155px;top:-220px;width:570px;height:570px;border:1px solid rgba(255,255,255,.17);border-radius:50%;box-shadow:0 0 0 36px rgba(255,255,255,.045),0 0 0 78px rgba(255,255,255,.03)}
    .analytics-hero .content{position:relative;z-index:1}
    .analytics-hero .kicker{color:var(--analytics-yellow)}
    .analytics-hero h1{max-width:900px;margin:12px 0 0;font-size:clamp(46px,6vw,78px);line-height:.98;letter-spacing:-.065em}
    .analytics-main{width:min(1150px,calc(100% - 64px));min-height:360px;margin:0 auto;padding:72px 0 110px}
    .analytics-rule{width:78px;height:6px;margin-bottom:32px;background:var(--analytics-yellow)}
    .analytics-placeholder{min-height:190px;border:1px dashed var(--analytics-line);background:var(--analytics-pale);border-radius:18px}
    @media(max-width:980px){.analytics-page .header nav{gap:12px}.analytics-page .header .button{display:none}.more-menu .more-panel{right:-12px}}
    @media(max-width:760px){.analytics-page .header{padding-left:20px;padding-right:20px}.analytics-page .header nav{display:none}.analytics-page .header .brand span{display:none}.analytics-main{width:min(100% - 40px,1150px);padding-top:42px}.more-menu .more-panel{grid-template-columns:1fr;min-width:220px}}
  </style>
</head>
<body class="analytics-page">
  <header class="header">
    <a class="brand" href="../"><strong>PSI</strong><span>Partnership for Scientific Inquiry</span></a>
    <nav aria-label="Primary navigation">
      <a href="../about/">About</a>
      <a href="../leadership/">Leadership</a>
      <a href="../application/">Application</a>
      <a href="../faq/">FAQ</a>
      <a href="../important-dates/">Important Dates</a>
      <a href="../contact/">Contact Us</a>
      <details class="more-menu">
        <summary>More</summary>
        <div class="more-panel">
          <a href="../awards/">Awards</a>
          <a href="../collaborations/">Collaborations</a>
          <a href="../testimonials/">Testimonials</a>
          <a href="../previous-lectures/">Lectures</a>
          <a href="../lewis-scholars/">Lewis Scholars</a>
          <a href="../alumni-achievements/">Alumni Achievements</a>
          <a href="../media/">Media</a>
          <a href="../donate/">Donate to PSI</a>
        </div>
      </details>
    </nav>
    <a class="button yellow" href="../donate/">Donate to PSI</a>
  </header>
  <main>
    <section class="analytics-hero">
      <div class="content">
        <p class="kicker">Partnership for Scientific Inquiry</p>
        <h1>Visitor Analytics</h1>
      </div>
    </section>
    <section class="analytics-main" aria-label="Visitor Analytics">
      <div class="analytics-rule" aria-hidden="true"></div>
      <div class="analytics-placeholder" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
